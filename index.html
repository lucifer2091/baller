<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ball Battle Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="mainMenu">
    <h1 class="menu-title">BALL BATTLE<br>SIMULATOR</h1>
    <div class="menu-buttons">
      <button data-action="create">CREATE</button>
      <button data-action="random-battle">RANDOM BATTLE</button>
      <button data-action="examples">EXAMPLES</button>
      <button data-action="settings">SETTINGS</button>
    </div>
  </div>

  <div id="buildToolbar" class="panel hidden">
    <h3>Tools</h3>
    <div class="tool-group">
      <button data-tool="select" class="tool-btn active">Select</button>
      <button data-tool="move" class="tool-btn">Move</button>
      <button data-tool="delete" class="tool-btn">Delete</button>
    </div>
    <h3>Objects</h3>
    <div class="tool-group">
      <button data-object-type="ball" class="tool-btn">Ball</button>
      <button data-object-type="block" class="tool-btn">Block</button>
      <button data-object-type="wall" class="tool-btn">Wall</button>
    </div>
    <h3>Quick Spawn</h3>
    <div class="tool-group">
      <button data-action="showBallEditor" class="btn btn-primary">Add Ball</button>
      <button data-action="showBlockEditor" class="btn btn-primary">Add Block</button>
    </div>
    <h3>Arena</h3>
    <button data-action="arena-editor">Arena Settings</button>
    <div class="toolbar-spacer"></div>
    <button data-action="back-to-menu" class="btn-secondary">Menu</button>
  </div>

  <div id="simControls" class="panel hidden">
    <button data-action="play" class="btn-play">PLAY</button>
    <button data-action="pause" class="btn-pause">PAUSE</button>
    <button data-action="stop" class="btn-stop">STOP</button>
    <button data-action="reset" class="btn-reset">RESET</button>
    <button data-action="step" class="btn-step">STEP</button>
    <div class="speed-control">
      <label>Speed:</label>
      <select id="speed-select" data-action="speed">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
        <option value="8">8x</option>
      </select>
    </div>
  </div>

  <div id="battleLog" class="panel hidden">
    <h3>Battle Log</h3>
    <div id="logEntries"></div>
    <button data-action="clearLog" class="btn btn-sm btn-secondary">Clear</button>
  </div>

  <div id="ballEditor" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Ball</h3>
        <button data-action="close" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <label>Name: <input type="text" id="ballName" data-prop="name"></label>
        <label>HP: <input type="number" id="ballHp" data-prop="hp" min="1" value="100"></label>
        <label>Damage: <input type="number" id="ballDamage" data-prop="damage" min="0" value="10"></label>
        <label>Speed: <input type="number" id="ballSpeed" data-prop="speed" min="0" value="5"></label>
        <label>Size: <input type="number" id="ballSize" data-prop="size" min="10" max="200" value="30"></label>
        <label>Mass: <input type="number" id="ballMass" data-prop="mass" min="1" value="10"></label>
        <label>AI Type:
          <select id="ballAi" data-prop="ai">
            <option value="aggressive">Aggressive</option>
            <option value="defensive">Defensive</option>
            <option value="random">Random</option>
            <option value="ranged">Ranged</option>
            <option value="melee">Melee</option>
            <option value="coward">Coward</option>
            <option value="guard">Guard</option>
            <option value="berserker">Berserker</option>
            <option value="passive">Passive</option>
          </select>
        </label>
        <label>Team:
          <select id="ballTeam" data-prop="team">
            <option value="Red">Red</option>
            <option value="Blue">Blue</option>
            <option value="Green">Green</option>
            <option value="Yellow">Yellow</option>
            <option value="Neutral">Neutral</option>
          </select>
        </label>
        <label>Weapon:
          <select id="ballWeapon" data-prop="weaponType">
            <option value="Sword">Sword</option>
            <option value="Hammer">Hammer</option>
            <option value="Axe">Axe</option>
            <option value="Spear">Spear</option>
            <option value="Laser">Laser</option>
            <option value="Cannon">Cannon</option>
            <option value="Bow">Bow</option>
            <option value="Dagger">Dagger</option>
            <option value="Shield">Shield</option>
            <option value="None">None</option>
          </select>
        </label>
      </div>
      <div class="modal-footer">
        <button data-action="apply-ball" class="btn-play">Add Ball</button>
        <button data-action="close" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="blockEditor" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Block</h3>
        <button data-action="close" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <label>Name: <input type="text" id="blockName" data-prop="name"></label>
        <label>HP: <input type="number" id="blockHp" data-prop="hp" min="1" value="200"></label>
        <label>Width: <input type="number" id="blockWidth" data-prop="width" min="10" value="100"></label>
        <label>Height: <input type="number" id="blockHeight" data-prop="height" min="10" value="50"></label>
        <label>Material:
          <select id="blockMaterial" data-prop="material">
            <option value="Brick">Brick</option>
            <option value="Stone">Stone</option>
            <option value="Metal">Metal</option>
            <option value="Glass">Glass</option>
            <option value="Rubber">Rubber</option>
            <option value="Ice">Ice</option>
            <option value="Explosive">Explosive</option>
            <option value="Indestructible">Indestructible</option>
          </select>
        </label>
        <label><input type="checkbox" id="blockBreakable" data-prop="breakable" checked> Breakable</label>
      </div>
      <div class="modal-footer">
        <button data-action="apply-block" class="btn-play">Add Block</button>
        <button data-action="close" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="arenaEditor" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Arena Settings</h3>
        <button data-action="close" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <label>Width: <input type="number" id="arenaWidth" data-prop="width" min="200" max="5000" value="1200"></label>
        <label>Height: <input type="number" id="arenaHeight" data-prop="height" min="200" max="5000" value="800"></label>
        <label>Boundary Type:
          <select id="boundaryType" data-prop="boundaryType">
            <option value="SolidWalls">Solid Walls</option>
            <option value="DeathWall">Death Wall</option>
            <option value="Wraparound">Wraparound</option>
            <option value="Portals">Portals</option>
          </select>
        </label>
        <h4>Presets</h4>
        <div id="arenaPresetList" class="preset-list"></div>
      </div>
      <div class="modal-footer">
        <button data-action="apply-arena" class="btn-play">Apply</button>
        <button data-action="close" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="settingsPanel" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Settings</h3>
        <button data-action="close" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <label>Gravity: <input type="range" id="gravitySlider" min="0" max="3" step="0.1" value="1"> <span id="gravityValue">1.0</span></label>
        <label>Time Scale: <input type="number" id="settingTimescale" data-prop="timescale" min="0.1" max="8" step="0.1" value="1"></label>
        <label>Damage Multiplier: <input type="number" id="settingDamage" data-prop="damageMultiplier" min="0" max="10" step="0.5" value="1"></label>
        <h4>Physics Presets</h4>
        <div class="preset-list">
          <button data-preset="normal" class="preset-btn">Normal</button>
          <button data-preset="zeroGravity" class="preset-btn">Zero Gravity</button>
          <button data-preset="lowGravity" class="preset-btn">Low Gravity</button>
          <button data-preset="highGravity" class="preset-btn">High Gravity</button>
          <button data-preset="superBounce" class="preset-btn">Super Bounce</button>
          <button data-preset="lowFriction" class="preset-btn">Low Friction</button>
          <button data-preset="highKnockback" class="preset-btn">High Knockback</button>
          <button data-preset="doubleDamage" class="preset-btn">Double Damage</button>
        </div>
      </div>
      <div class="modal-footer">
        <button data-action="apply-settings" class="btn-play">Apply</button>
        <button data-action="close" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="resultsPanel" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Simulation Results</h3>
        <button data-action="close" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="winnerDisplay">No winner yet</div>
        <div id="resultsStats"></div>
      </div>
      <div class="modal-footer">
        <button data-action="close-results" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="examplesPanel" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Example Simulations</h3>
        <button data-action="close" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="examplesList" class="examples-list"></div>
      </div>
      <div class="modal-footer">
        <button data-action="close-examples" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="hud" class="panel hidden">
    <span id="hudState">State: Idle</span>
    <span id="hudZoom">Zoom: 1.00x</span>
    <span id="hudTimeScale">Speed: 1x</span>
    <span id="hudTime">Time: 0.0s</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/balls.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/special.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/save.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
